# The process-wrap profile for this machine, written for WSL2 (specification section
# 16). This file is the canonical copy and lives in the dotfiles repository:
# `mise bootstrap dotfiles apply` writes it out to
# ~/.config/process-wrap/profile/default.toml as a real file (template mode, not a
# symbolic link), so `process-wrap init` is not used. Edit it here and apply again.
#
# Paths are absolute, start with `~` (the real path of HOME), or start with one of the
# four variables: ${workspace}, ${worktree}, ${git_common_dir}, ${config_dir}. An item
# whose path does not exist is skipped and shown as skipped in `--print-plan`.

[mounts]
# The work place: the workspace, the worktree it is in, and the shared .git of a linked
# worktree or a submodule (skipped when the worktree is not under git). /tmp is hidden
# below; /tmp/process-wrap is the one directory shared with the host, created by you or
# by your shim (process-wrap never creates it; without it the item is skipped and /tmp
# stays empty).
rw = [
    "${workspace}",
    "${worktree}",
    "${git_common_dir}",
    "/tmp/process-wrap",
    # package caches
    "~/.cache",
    "~/.cargo/registry",
    "~/.cargo/git",
    "~/.npm",
    "~/.bun/install/cache",
    # codex: config.toml stays writable through this bind; codex persists it via
    # tmp + rename, which an rw-file bind of its own would break
    "~/.codex",
    "~/.codex/rules",
    # opencode (spawned as a model backend)
    "~/.local/share/opencode",
    "~/.local/state/opencode",
    # claude code (same role)
    "~/.claude",
]

# Lives directly under HOME, which is never rw. Claude Code writes it in place, so the
# rw-file limitation (a tmp + rename replace fails) does not bite.
rw-file = ["~/.claude.json"]

# The instructions and settings the agent CLIs run under are read-only; their runtime
# state above is rw. Every single file named here is distributed as a real file, not as
# a symbolic link, except the items whose own comment says the host executes this
# repository's checkout directly: `ro` binds the resolved target, so a link left in the
# rw parent could be removed inside the isolation and replaced with a regular file
# (specification sections 5.6 and 6.2). Links under the directories named here are
# covered by the directory's own bind, but that covers the link, not what it points at:
# when the target resolves into a writable item, it stays writable through the link, so
# the target has to be named here as well (`~/.claude/hooks` and its target below).
# On this repository's checkout, the target is named only for the code the host runs
# without a person reading it first (the shim and `ai/shared/hooks` below). What the
# links under `~/.claude/rules`, `agents` and `output-styles` point at is left out on
# purpose: they are instruction documents a person reviews in `git diff`, and `ro`
# would make them uneditable; the process-wrap section of docs/dependencies.md records
# that limit.
ro = [
    "~/.codex/AGENTS.md",
    "~/.codex/hooks.json",
    "~/.codex/hooks",
    "~/.codex/skills",
    "~/.codex/prompts",
    "~/.config/opencode",
    "~/.claude/CLAUDE.md",
    "~/.claude/settings.json",
    # A settings file can define hooks, and a plugin carries hooks of its own; the host
    # runs both outside the isolation, so both are read-only for the same reason as
    # settings.json above. settings.local.json is the local counterpart of settings.json,
    # and plugins/ is where an installed plugin's own hooks live.
    "~/.claude/settings.local.json",
    "~/.claude/plugins",
    # The host runs statusline.py outside the isolation, through statusLine. Writable
    # here would mean arbitrary code on the host.
    "~/.claude/statusline.py",
    "~/.claude/hooks",
    "~/.claude/rules",
    "~/.claude/output-styles",
    "~/.claude/agents",
    "~/.claude/commands",
    "~/.claude/skills",
    # The shim directory the host runs `codex` from, through PATH (fish via the mise
    # config, the Claude Code Bash tool and hooks via settings.json). Unlike everything
    # above, it is not distributed: the host executes this repository's checkout itself,
    # so the header's "distributed as a real file" does not apply here, and the same
    # directory is inside the rw workspace whenever dotfiles is the work place. Without
    # this item the isolation could rewrite the shim into host code for the next launch.
    # The protection is partial: it stops a rewrite in place, but the directory sits three
    # levels under the workspace, and renaming `ai` or `ai/process-wrap` to put another
    # tree at the same path is still allowed (specification section 5.6). The item below
    # carries the same route; every other ro-under-rw item here sits directly under its
    # mount point and has no such route.
    "{{ vars.dotfiles_root }}/ai/process-wrap/shim",
    # The hook scripts the host runs outside the isolation, named by settings.json.
    # `~/.claude/hooks` above only covers the directory the links sit in: the `*.py`
    # entries there are symbolic links `mise bootstrap` made, and `ro` binds the resolved
    # target (specification sections 5.6 and 6.2), which is this repository's checkout
    # and therefore inside the rw workspace whenever dotfiles is the work place. Like
    # the shim above it is not distributed, and the protection is partial in the same
    # way: the directory sits three levels under the workspace, so renaming `ai` or
    # `ai/shared` is still a route to another tree at the same path.
    "{{ vars.dotfiles_root }}/ai/shared/hooks",
    # The image-paste stand-in reads the PNG clipboard2path-wsl keeps here. It sits
    # under the hidden /run/user below, so it has to be named back in.
    "/run/user/1000/clipboard2path",
]

hide = [
    # Private writable CA storage. Keep host certificates and keys out of the
    # isolation while allowing Safe Chain to renew its short-lived certificates.
    # The executable and shims remain read-only through the root mount.
    "~/.safe-chain/certs",
    # /tmp holds the host's X11 and ssh-agent sockets under random names, so it cannot
    # be hidden by name: it is replaced by an empty directory, and /tmp/process-wrap
    # above is the shared place. /run/user holds the session's sockets (D-Bus, gpg-agent,
    # Wayland) the same way.
    "/tmp",
    "/run/user",
    # credentials
    "~/.ssh",
    "~/.aws",
    "~/.gnupg",
    "~/.config/gh",
    "~/.config/gcloud",
    "~/.docker",
    "~/.kube",
    # Claude Code writes a snapshot-bash-*.sh here when a session starts, and its Bash
    # tool runs `source <snapshot> && eval ...` on the host, outside the isolation, on
    # every call. It is under the rw ~/.claude above, so it needs an item of its own.
    # Hidden rather than read-only: a hidden directory is empty but writable (section
    # 6.1), so a claude spawned inside still writes its own snapshots there, while the
    # host's snapshots stay invisible and untouchable.
    "~/.claude/shell-snapshots",
    # Claude Code writes <session id>/sessionstart-hook-*.sh here when a session starts,
    # and the `export` lines inside become environment variables of the host's Bash tool,
    # outside the isolation. It is under the rw ~/.claude above, and it is hidden rather
    # than read-only for the same reason as shell-snapshots above.
    "~/.claude/session-env",
    # WSL interop: binfmt_misc hands every MZ file to /init, which launches it as a
    # Windows process through the socket in /run/WSL, outside every hide above, with the
    # whole distro readable via \\wsl$. Hiding the drives below only removes the obvious
    # binaries; an .exe copied or downloaded into the isolation would still escape.
    "/run/WSL",
]

# Environment files anywhere in the worktree read as empty inside the isolation.
[[mounts.scan]]
root    = "${worktree}"
names   = [".env", ".env.*"]
exclude = ["*.example", "*.sample", "*.dist", "*.template"]
prune   = [".git", "node_modules"]

# The Windows drives mounted under /mnt are hidden, except the one the work place is on.
[[mounts.hide-mounts]]
under  = "/mnt"
fstype = ["9p", "drvfs"]

[network]
mode = "host"

[env]
mode = "inherit"
# Sockets that carry authentication or input are hidden above; these variables are the
# other half of that path. Credentials in the host environment are dropped by name.
unset = [
    "SSH_AUTH_SOCK",
    "DISPLAY",
    "WAYLAND_DISPLAY",
    "XAUTHORITY",
    "*_TOKEN",
    "*_API_KEY",
    "*_SECRET*",
    "*_PASSWORD",
    "AWS_*",
    "GH_*",
    "GITHUB_*",
]
# Stand-ins for host commands the isolation cuts off, first on PATH inside it.
# `mise bootstrap dotfiles apply` writes powershell.exe there as a real file.
path-prepend = ["~/.local/lib/process-wrap/bin"]

# Secrets are read from files under the configuration directory's secrets/, which is
# always hidden inside the isolation. GH_TOKEN below carries a fine-grained PAT instead
# of the `gh auth login` credentials, which stay hidden. Until secrets/gh-token exists,
# every run warns that the file is missing and no token enters the isolation.
[secrets]
GH_TOKEN = "${config_dir}/secrets/gh-token"

# ~/.ssh is hidden, so an SSH remote cannot authenticate. These rewrite it to HTTPS,
# which the token above covers, without touching the host's .gitconfig.
[git.instead-of]
"git@github.com:" = "https://github.com/"
"ssh://git@github.com/" = "https://github.com/"
