# A kakoi policy file (process scope) that makes the work place read-only on top of the
# profile, for handing a review or an investigation to another agent that must not change
# the repository:
#
#   kakoi --policy-file <this file> -- opencode2 run --standalone --auto ...
#
# Across layers the upper layer replaces the lower one for the same path, so these `ro`
# items replace the profile's `rw` for the workspace, the worktree and the shared .git.
# kakoi warns that no `rw` item covers the workspace; that is the point of this file.
#
# The build output stays writable so the agent can still build and run tests. `target/`
# covers Cargo; an item whose path does not exist is skipped.
#
# `opencode2 run` without `--standalone` hands the work to the background service, which
# runs outside the isolation and can write the repository (measured 2026-09-23).

[mounts]
ro = ["${workspace}", "${worktree}", "${git_common_dir}"]
rw = ["${workspace}/target"]
