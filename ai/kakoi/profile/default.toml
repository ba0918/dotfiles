# The kakoi profile for this machine, written for WSL2 (specification section
# 16). This file is the canonical copy and lives in the dotfiles repository:
# `mise bootstrap dotfiles apply` writes it out to
# ~/.config/kakoi/profile/default.toml as a real file (template mode, not a
# symbolic link), so `kakoi init` is not used. Edit it here and apply again.
#
# Paths are absolute, start with `~` (the real path of HOME), or start with one of the
# four variables: ${workspace}, ${worktree}, ${git_common_dir}, ${config_dir}. An item
# whose path does not exist is skipped and shown as skipped in `--print-plan`.

[mounts]
# The work place: the workspace, the worktree it is in, and the shared .git of a linked
# worktree or a submodule (skipped when the worktree is not under git). /tmp is hidden
# below; /tmp/kakoi is the one directory shared with the host, created by you or
# by your shim (kakoi never creates it; without it the item is skipped and /tmp
# stays empty).
rw = [
    "${workspace}",
    "${worktree}",
    "${git_common_dir}",
    "/tmp/kakoi",
    # package caches
    "~/.cache",
    "~/.cargo/registry",
    "~/.cargo/git",
    "~/.npm",
    "~/.bun/install/cache",
    # codex: config.toml stays writable through this bind; codex persists it via
    # tmp + rename, which an rw-file bind of its own would break
    "~/.codex",
    "~/.codex/rules",
    # opencode (spawned as a model backend)
    "~/.local/share/opencode",
    "~/.local/state/opencode",
    # claude code (same role)
    "~/.claude",
]

# Lives directly under HOME, which is never rw. Claude Code writes it in place, so the
# rw-file limitation (a tmp + rename replace fails) does not bite.
rw-file = ["~/.claude.json"]

# The instructions and settings the agent CLIs run under are read-only; their runtime
# state above is rw. Every single file named here is distributed as a real file, not as
# a symbolic link, except the items whose own comment says the host executes this
# repository's checkout directly: `ro` binds the resolved target, so a link left in the
# rw parent could be removed inside the isolation and replaced with a regular file
# (specification sections 5.6 and 6.2). Links under the directories named here are
# covered by the directory's own bind, but that covers the link, not what it points at:
# when the target resolves into a writable item, it stays writable through the link, so
# the target has to be named here as well (`~/.claude/hooks` and its target below).
# On this repository's checkout, the target is named only for the code the host runs
# without a person reading it first (the shim and `ai/shared/hooks` below). What the
# links under `~/.claude/rules`, `agents` and `output-styles` point at is left out on
# purpose: they are instruction documents a person reviews in `git diff`, and `ro`
# would make them uneditable; the kakoi section of docs/dependencies.md records
# that limit.
ro = [
    "~/.codex/AGENTS.md",
    "~/.codex/hooks.json",
    "~/.codex/hooks",
    "~/.codex/skills",
    "~/.codex/prompts",
    "~/.config/opencode",
    "~/.claude/CLAUDE.md",
    "~/.claude/settings.json",
    # A settings file can define hooks, and a plugin carries hooks of its own; the host
    # runs both outside the isolation, so both are read-only for the same reason as
    # settings.json above. settings.local.json is the local counterpart of settings.json,
    # and plugins/ is where an installed plugin's own hooks live.
    "~/.claude/settings.local.json",
    "~/.claude/plugins",
    # The host runs statusline.py outside the isolation, through statusLine. Writable
    # here would mean arbitrary code on the host.
    "~/.claude/statusline.py",
    "~/.claude/hooks",
    "~/.claude/rules",
    "~/.claude/output-styles",
    "~/.claude/agents",
    "~/.claude/commands",
    "~/.claude/skills",
    # The shim directory the host runs `codex` from, through PATH (fish via the mise
    # config, the Claude Code Bash tool and hooks via settings.json). Unlike everything
    # above, it is not distributed: the host executes this repository's checkout itself,
    # so the header's "distributed as a real file" does not apply here, and the same
    # directory is inside the rw workspace whenever dotfiles is the work place. Without
    # this item the isolation could rewrite the shim into host code for the next launch.
    # The protection is partial: it stops a rewrite in place, but the directory sits three
    # levels under the workspace, and renaming `ai` or `ai/kakoi` to put another
    # tree at the same path is still allowed (specification section 5.6). The item below
    # carries the same route; every other ro-under-rw item here sits directly under its
    # mount point and has no such route.
    "{{ vars.dotfiles_root }}/ai/kakoi/shim",
    # The hook scripts the host runs outside the isolation, named by settings.json.
    # `~/.claude/hooks` above only covers the directory the links sit in: the `*.py`
    # entries there are symbolic links `mise bootstrap` made, and `ro` binds the resolved
    # target (specification sections 5.6 and 6.2), which is this repository's checkout
    # and therefore inside the rw workspace whenever dotfiles is the work place. Like
    # the shim above it is not distributed, and the protection is partial in the same
    # way: the directory sits three levels under the workspace, so renaming `ai` or
    # `ai/shared` is still a route to another tree at the same path.
    "{{ vars.dotfiles_root }}/ai/shared/hooks",
    # The package managers' user configuration: ~/.npmrc, ~/.bunfig.toml and
    # ~/.config/pnpm/config.yaml are links into this repository's checkout, so whenever
    # dotfiles is the work place the isolation could drop minimumReleaseAge or change the
    # registry for the host's next install. The same partial protection as the two items
    # above applies (renaming the parent is still a route).
    "{{ vars.dotfiles_root }}/npm",
    "{{ vars.dotfiles_root }}/bun",
    "{{ vars.dotfiles_root }}/pnpm",
    # The image-paste stand-in reads the PNG clipboard2path-wsl keeps here. It sits
    # under the hidden /run/user below, so it has to be named back in.
    "/run/user/1000/clipboard2path",
]

hide = [
    # Private writable CA storage. Keep host certificates and keys out of the
    # isolation while allowing Safe Chain to renew its short-lived certificates.
    # The executable and shims remain read-only through the root mount.
    "~/.safe-chain/certs",
    # /tmp holds the host's X11 and ssh-agent sockets under random names, so it cannot
    # be hidden by name: it is replaced by an empty directory, and /tmp/kakoi
    # above is the shared place. /run/user holds the session's sockets (D-Bus, gpg-agent,
    # Wayland) the same way.
    "/tmp",
    "/run/user",
    # credentials
    "~/.ssh",
    "~/.aws",
    "~/.gnupg",
    "~/.config/gh",
    "~/.config/gcloud",
    # the npm publish token read by the npm-publish fish function
    "~/.config/npm",
    "~/.docker",
    "~/.kube",
    # Claude Code writes a snapshot-bash-*.sh here when a session starts, and its Bash
    # tool runs `source <snapshot> && eval ...` on the host, outside the isolation, on
    # every call. It is under the rw ~/.claude above, so it needs an item of its own.
    # Hidden rather than read-only: a hidden directory is empty but writable (section
    # 6.1), so a claude spawned inside still writes its own snapshots there, while the
    # host's snapshots stay invisible and untouchable.
    "~/.claude/shell-snapshots",
    # Claude Code writes <session id>/sessionstart-hook-*.sh here when a session starts,
    # and the `export` lines inside become environment variables of the host's Bash tool,
    # outside the isolation. It is under the rw ~/.claude above, and it is hidden rather
    # than read-only for the same reason as shell-snapshots above.
    "~/.claude/session-env",
    # A second copy of the git binary outside the command guards below, reachable by
    # absolute path (/usr/lib/git-core/git and the git-* builtins linked to it). git
    # itself runs builtins in process; hooks and git's own scripts find `git` through
    # PATH and fall through to the guarded one (measured: commit hooks, https fetch,
    # worktree and submodule still work).
    "/usr/lib/git-core/git",
    # WSL interop: binfmt_misc hands every MZ file to /init, which launches it as a
    # Windows process through the socket in /run/WSL, outside every hide above, with the
    # whole distro readable via \\wsl$. Hiding the drives below only removes the obvious
    # binaries; an .exe copied or downloaded into the isolation would still escape.
    "/run/WSL",
]

# Environment files anywhere in the worktree read as empty inside the isolation.
[[mounts.scan]]
root    = "${worktree}"
names   = [".env", ".env.*"]
exclude = ["*.example", "*.sample", "*.dist", "*.template"]
prune   = [".git", "node_modules"]

# The Windows drives mounted under /mnt are hidden, except the one the work place is on.
[[mounts.hide-mounts]]
under  = "/mnt"
fstype = ["9p", "drvfs"]

[network]
mode = "host"

[env]
mode = "inherit"
# Sockets that carry authentication or input are hidden above; these variables are the
# other half of that path. Credentials in the host environment are dropped by name.
unset = [
    "SSH_AUTH_SOCK",
    "DISPLAY",
    "WAYLAND_DISPLAY",
    "XAUTHORITY",
    "*_TOKEN",
    "*_API_KEY",
    "*_SECRET*",
    "*_PASSWORD",
    "AWS_*",
    "GH_*",
    "GITHUB_*",
]
# Stand-ins for host commands the isolation cuts off, first on PATH inside it.
# `mise bootstrap dotfiles apply` writes powershell.exe there as a real file.
path-prepend = ["~/.local/lib/kakoi/bin"]

# Secrets are read from files under the configuration directory's secrets/, which is
# always hidden inside the isolation. GH_TOKEN below carries a fine-grained PAT instead
# of the `gh auth login` credentials, which stay hidden. Until secrets/gh-token exists,
# every run warns that the file is missing and no token enters the isolation.
[secrets]
GH_TOKEN = "${config_dir}/secrets/gh-token"

# ~/.ssh is hidden, so an SSH remote cannot authenticate. These rewrite it to HTTPS,
# which the token above covers, without touching the host's .gitconfig.
[git.instead-of]
"git@github.com:" = "https://github.com/"
"ssh://git@github.com/" = "https://github.com/"

# Guardrails for operations the GH_TOKEN above can still do and nobody can undo: the
# fine-grained PAT cannot be narrowed further (docs/kakoi.md, GitHub token), so a
# force push to main or an issue deletion goes through on GitHub's side. These rules are
# accident prevention, not a boundary: they only catch a program found through PATH, and
# an absolute path (/usr/bin/git) or a program other than git or gh walks past them.
# Rules cannot be removed by an upper layer, so everything here applies to every run
# under this profile. `examples` is checked on every load; a rule that stops matching
# them fails the start instead of going quiet.
#
# `guard-absolute-path` puts the guard over the real binary too, so `/usr/bin/git` does
# not walk past it; kakoi applies it per program, and every rule repeats it so that none
# reads as PATH-only. Debian also ships a second copy of git at /usr/lib/git-core/git
# (the dashed builtins such as git-commit link to it), which no guard covers; it is
# hidden in [mounts] above. Copying the relocated binary into a writable place still
# gets past all of this: it stops accidents, not intent.
#
# Global git options that take a value, declared so that `git -C dir push --force` is
# still read from `push`.
[[commands.guard]]
program = "git"
guard-absolute-path = true
reason = "force pushing rewrites published history; ask the person to do it"
options-with-value = ["-C", "-c", "--config-env", "--git-dir", "--work-tree", "--namespace"]
for = [["push"]]
deny-flags = ["--force", "-f", "--force-with-lease", "--force-if-includes", "--mirror"]
# A refspec starting with `+` forces that one ref. Only caught right after the remote;
# an option between `push` and the remote is not skipped (13-command-guard.md).
deny = [["push", "/.*/", "/[+].*/"]]
examples.deny = [
    "git push --force",
    "git push -f origin main",
    "git push -uf origin topic",
    "git -C repo push --force-with-lease",
    "git push --force=yes",
    "git push --mirror origin",
    "git push origin +main",
]
examples.allow = [
    "git push",
    "git push -u origin topic",
    "git push origin topic -- --force",
    "git checkout -f main",
    "git commit -m 'force push fix'",
]

# An alias would run `push --force` under another name, past the rule above.
# GIT_CONFIG_* is not denied: [git.instead-of] above puts it in the environment itself.
[[commands.guard]]
program = "git"
guard-absolute-path = true
reason = "git aliases can run a guarded command under another name; call the command directly"
options-with-value = ["-C", "-c", "--config-env", "--git-dir", "--work-tree", "--namespace"]
deny = [
    ["config", "/(?i)alias[.].*/"],
    ["config", ["--local", "--worktree", "--global", "--system", "--add", "--replace-all"], "/(?i)alias[.].*/"],
]
deny-option-values = { "-c" = ["/(?i)alias[.].*/"], "--config-env" = ["/(?i)alias[.].*/"] }
examples.deny = [
    "git -c alias.p=push p",
    "git --config-env=alias.p=ENV p",
    "git config alias.p 'push --force'",
    "git config --local alias.p push",
]
examples.allow = [
    "git -c color.ui=false log",
    "git config user.name",
    "git status",
]

# The pre-commit and pre-push hooks run the secret scan, lint and tests; skipping them
# lets a leaked credential or a failing change reach history or the remote. `-n` means
# --no-verify only for commit (for push it is --dry-run), so it has a rule of its own.
# The LEFTHOOK* variables turn lefthook off or swap its binary from the environment.
[[commands.guard]]
program = "git"
guard-absolute-path = true
reason = "commit and push hooks run the secret scan and the tests; do not skip them, fix what they report"
options-with-value = ["-C", "-c", "--config-env", "--git-dir", "--work-tree", "--namespace"]
for = [["commit"], ["push"], ["merge"], ["rebase"], ["am"], ["cherry-pick"], ["revert"]]
deny-flags = ["--no-verify"]
deny-env = ["LEFTHOOK", "LEFTHOOK_BIN", "LEFTHOOK_EXCLUDE"]
examples.deny = [
    "git commit --no-verify -m msg",
    "git push --no-verify",
    "git -C repo merge --no-verify topic",
    "git rebase --no-verify main",
    "LEFTHOOK=0 git commit -m msg",
    "LEFTHOOK_BIN=/bin/true git push",
]
examples.allow = [
    "git commit -m 'drop --no-verify from the docs'",
    "git push origin topic",
    "git log --no-verify",
    "LEFTHOOK=0 git status",
]

[[commands.guard]]
program = "git"
guard-absolute-path = true
reason = "commit hooks run the secret scan and the tests; do not skip them, fix what they report"
options-with-value = ["-C", "-c", "--config-env", "--git-dir", "--work-tree", "--namespace"]
for = [["commit"]]
deny-flags = ["-n"]
examples.deny = [
    "git commit -n -m msg",
    "git commit -anm msg",
]
examples.allow = [
    "git commit -am msg",
    "git push -n",
]

# Pointing core.hooksPath elsewhere skips every hook at once.
[[commands.guard]]
program = "git"
guard-absolute-path = true
reason = "changing core.hooksPath skips the commit and push hooks; do not skip them"
options-with-value = ["-C", "-c", "--config-env", "--git-dir", "--work-tree", "--namespace"]
# A value after the key sets it; the key alone only reads it and stays allowed.
deny = [
    ["config", "/(?i)core[.]hookspath/", "/.*/"],
    ["config", ["--local", "--worktree", "--global", "--system", "--add", "--replace-all"], "/(?i)core[.]hookspath/", "/.*/"],
    ["config", ["--unset", "--unset-all"], "/(?i)core[.]hookspath/"],
]
deny-option-values = { "-c" = ["/(?i)core[.]hookspath(=.*)?/"], "--config-env" = ["/(?i)core[.]hookspath=.*/"] }
examples.deny = [
    "git -c core.hooksPath=/dev/null commit -m msg",
    "git --config-env=core.hooksPath=ENV push",
    "git config core.hooksPath /tmp/empty",
    "git config --local core.hooksPath /tmp/empty",
    "git config --unset core.hooksPath",
]
examples.allow = [
    "git config core.hooksPath",
    "git -c core.autocrlf=false status",
]

[[commands.guard]]
program = "gh"
guard-absolute-path = true
reason = "deleting or archiving on GitHub cannot be undone; ask the person to do it"
deny = [
    ["issue", "delete"],
    ["repo", ["delete", "archive"]],
    ["release", ["delete", "delete-asset"]],
]
examples.deny = [
    "gh issue delete 12 --yes",
    "gh repo delete owner/repo --yes",
    "gh repo archive owner/repo",
    "gh release delete v1.0.0",
    "gh release delete-asset v1.0.0 file.tar.gz",
]
examples.allow = [
    "gh issue close 12",
    "gh repo view",
    "gh release list",
    "gh pr merge 3",
]

# The REST API reaches the same deletions.
[[commands.guard]]
program = "gh"
guard-absolute-path = true
reason = "DELETE requests through gh api cannot be undone; ask the person to do it"
options-with-value = ["-R", "--repo"]
for = [["api"]]
deny-option-values = { "-X" = ["/(?i)delete/"], "--method" = ["/(?i)delete/"] }
examples.deny = [
    "gh api -X DELETE repos/owner/repo/issues/1",
    "gh api --method=delete repos/owner/repo",
    "gh api repos/owner/repo --method DELETE",
]
examples.allow = [
    "gh api repos/owner/repo",
    "gh api -X PATCH repos/owner/repo/issues/1 -f state=closed",
]
