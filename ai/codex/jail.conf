# Mount table for the codex jail (ai/codex/bin/codex). One directive per line:
#
#   rw   PATH   read-write bind (skipped when PATH does not exist)
#   ro   PATH   read-only overlay, mounted after every rw bind (symlinks resolved)
#   hide PATH   blanked out: directories become an empty tmpfs, files read as empty
#
# `~` expands to $HOME. The current worktree, its shared .git, /tmp and
# --add-dir targets are always rw and are not listed here. Later mounts
# shadow earlier ones, except that a hide covering an rw path is mounted
# before it so the rw path shows through (a repo kept on /mnt/c).
#
# Rule of thumb for agent CLIs hosted inside the jail: their runtime state is
# rw, the instructions and settings they run under are ro. Credential files
# stay rw because the CLIs rewrite them on token refresh; reading them is
# inherent to running the CLI at all.

# --- package caches ------------------------------------------------------------
rw ~/.cache
rw ~/.cargo/registry
rw ~/.cargo/git
rw ~/.npm
rw ~/.bun/install/cache

# --- codex ----------------------------------------------------------------------
rw ~/.codex
rw ~/.codex/config.toml
ro ~/.codex/AGENTS.md
ro ~/.codex/hooks.json
ro ~/.codex/hooks
rw ~/.codex/rules
ro ~/.codex/skills
ro ~/.codex/prompts

# --- opencode (spawned by cycle / skill-regression as a model backend) ---------
rw ~/.local/share/opencode
rw ~/.local/state/opencode
ro ~/.config/opencode

# --- claude code (same role) ----------------------------------------------------
rw ~/.claude
rw ~/.claude.json
ro ~/.claude/CLAUDE.md
ro ~/.claude/settings.json
ro ~/.claude/hooks
ro ~/.claude/rules
ro ~/.claude/output-styles
ro ~/.claude/agents
ro ~/.claude/commands
ro ~/.claude/skills

# --- secrets ----------------------------------------------------------------------
hide ~/.ssh
hide ~/.aws
hide ~/.gnupg
hide ~/.config/gh
hide ~/.docker
hide ~/.kube
