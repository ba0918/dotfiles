# Mount table for the codex jail (ai/codex/bin/codex). One directive per line:
#
#   rw      PATH  read-write bind of a directory (skipped when PATH does not exist)
#   rw-file PATH  read-write bind of a single file; in-place writes only, a
#                 tmp + rename replace fails on it (EBUSY), so prefer putting
#                 the file under an rw directory. Refused for `rw`
#   ro      PATH  read-only overlay, mounted after every rw bind (symlinks resolved)
#   hide    PATH  blanked out: directories become an empty tmpfs, files read as empty
#
# `~` expands to $HOME. The current worktree, its shared .git, /tmp and
# --add-dir targets are always rw and are not listed here. Later mounts
# shadow earlier ones, except that a hide covering an rw path is mounted
# before it so the rw path shows through (a repo kept on /mnt/c).
#
# Rule of thumb for agent CLIs hosted inside the jail: their runtime state is
# rw, the instructions and settings they run under are ro. Credential files
# stay rw because the CLIs rewrite them on token refresh; reading them is
# inherent to running the CLI at all.

# --- package caches ------------------------------------------------------------
rw ~/.cache
rw ~/.cargo/registry
rw ~/.cargo/git
rw ~/.npm
rw ~/.bun/install/cache

# --- codex ----------------------------------------------------------------------
# config.toml stays writable through this bind; codex persists it via
# tmp + rename, which a file bind of its own would break (see rw-file above).
rw ~/.codex
ro ~/.codex/AGENTS.md
ro ~/.codex/hooks.json
ro ~/.codex/hooks
rw ~/.codex/rules
ro ~/.codex/skills
ro ~/.codex/prompts

# --- opencode (spawned by cycle / skill-regression as a model backend) ---------
rw ~/.local/share/opencode
rw ~/.local/state/opencode
ro ~/.config/opencode

# --- claude code (same role) ----------------------------------------------------
rw ~/.claude
# Lives directly under $HOME, which is never rw. Claude Code writes it in place
# (verified with 2.1.246), so the rw-file limitation does not bite today.
rw-file ~/.claude.json
ro ~/.claude/CLAUDE.md
ro ~/.claude/settings.json
ro ~/.claude/hooks
ro ~/.claude/rules
ro ~/.claude/output-styles
ro ~/.claude/agents
ro ~/.claude/commands
ro ~/.claude/skills

# --- secrets ----------------------------------------------------------------------
hide ~/.ssh
hide ~/.aws
hide ~/.gnupg
hide ~/.config/gh
hide ~/.config/gcloud
hide ~/.docker
hide ~/.kube

# --- WSL interop ----------------------------------------------------------------
# binfmt_misc hands every MZ file to /init, which launches it as a Windows
# process through the socket in /run/WSL: outside every hide above, with the
# whole distro readable via \\wsl$. Hiding the drives only removes the obvious
# binaries; an .exe copied or downloaded into the jail would still escape.
# Codex's own image paste relies on this channel (powershell.exe); the jail
# answers that one request with ai/codex/jail-bin/powershell.exe instead.
hide /run/WSL
