# CI for the dotfiles repository.
#
# Three independent jobs: the test suites (scripts/run-tests.sh), shellcheck
# over every tracked bash script (scripts/lint.sh), and a secret scan that
# runs behind the local pre-commit hook so a `--no-verify` commit is still
# caught before it sits unnoticed in a public repository.
#
# Actions are pinned to commit SHAs (the tag is noted alongside) so an upstream
# tag move cannot change what runs here.

name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install pytest
        run: python -m pip install pytest==9.0.2
      - name: Install bubblewrap
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends bubblewrap
      # Ubuntu 24.04 restricts unprivileged user namespaces through AppArmor;
      # the codex jail shim (and its harness) needs them for bwrap.
      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Run test suites
        run: bash scripts/run-tests.sh

  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: shellcheck
        run: bash scripts/lint.sh

  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: gitleaks (full history)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_ENABLE_COMMENTS: "false"
      # Same config as the pre-commit hook. The preset is named explicitly
      # because the secretlint package does not pull it in on its own.
      - name: secretlint (tracked files)
        run: |
          git ls-files -z | xargs -0 npx --yes \
            -p secretlint@13.0.4 \
            -p @secretlint/secretlint-rule-preset-recommend@13.0.4 \
            secretlint --secretlintrc git/.config/secretlint/.secretlintrc.json
