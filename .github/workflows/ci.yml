# CI for the dotfiles repository.
#
# Three independent jobs: the test suites (scripts/run-tests.sh), shellcheck
# over every tracked bash script (scripts/lint.sh), and a secret scan that
# runs behind the local pre-commit hook so a `--no-verify` commit is still
# caught before it sits unnoticed in a public repository.
#
# Actions are pinned to commit SHAs (the tag is noted alongside) so an upstream
# tag move cannot change what runs here.

name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install pytest
        run: python -m pip install pytest==9.0.2
      - name: Install secretlint for the pre-commit hook harness
        run: npm ci --prefix git/.config/secretlint --ignore-scripts --no-fund --no-audit
      - name: Run test suites
        run: bash scripts/run-tests.sh

  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned ShellCheck
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("mise/config.toml", "rb"))["tools"]["shellcheck"])')
          archive="$RUNNER_TEMP/shellcheck.tar.xz"
          curl -fsSL "https://github.com/koalaman/shellcheck/releases/download/v${version}/shellcheck-v${version}.linux.x86_64.tar.xz" -o "$archive"
          echo "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198  $archive" | sha256sum -c -
          tar -xJf "$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/shellcheck-v${version}" >> "$GITHUB_PATH"
      - name: shellcheck
        run: bash scripts/lint.sh

  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: gitleaks (full history)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_ENABLE_COMMENTS: "false"
      # The same install and config the pre-commit hook uses, from the lockfile.
      - name: Install secretlint
        run: npm ci --prefix git/.config/secretlint --ignore-scripts --no-fund --no-audit
      - name: secretlint (tracked files)
        run: |
          git ls-files -z | xargs -0 git/.config/secretlint/node_modules/.bin/secretlint \
            --secretlintrc git/.config/secretlint/.secretlintrc.json
