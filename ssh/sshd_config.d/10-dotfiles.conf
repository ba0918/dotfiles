# Installed by dotfiles (ssh/install.sh) into /etc/ssh/sshd_config.d/.
# Numbered 10 so it precedes 50-cloud-init.conf: sshd keeps the first value it
# reads for each keyword, so a later "PasswordAuthentication yes" cannot undo it.
PubkeyAuthentication yes
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
