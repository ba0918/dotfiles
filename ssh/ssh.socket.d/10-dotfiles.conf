# Installed by dotfiles (ssh/install.sh) into /etc/systemd/system/ssh.socket.d/.
# Ubuntu starts sshd through socket activation, so Port / ListenAddress in
# sshd_config are ignored; the listen addresses live here. Loopback only: with
# WSL mirrored networking, a 0.0.0.0 bind is reachable from the LAN through the
# Windows host, and the only client is the Windows host itself.
[Socket]
ListenStream=
ListenStream=127.0.0.1:22
ListenStream=[::1]:22
