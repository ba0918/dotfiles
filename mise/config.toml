[env]
# bun global installs (e.g. agent-browser) are not in mise-managed paths
_.path = ["~/.bun/bin", "~/.cargo/bin", "~/.safe-chain/shims"]

[settings]
dotfiles.default_mode = "symlink"
minimum_release_age = "7d"
# 自作ツールの aqua カスタムレジストリ（ツール repo が公開する URL）
aqua.registries = ["https://raw.githubusercontent.com/ba0918/clipboard2path-wsl/main/registry.yaml"]

[vars]
# MISE_GLOBAL_CONFIG_ROOT（bootstrap.sh / fish config.fish が repo ルートに設定）が
# config_root を repo ルートへ解決し、dotfiles の template から参照できる
dotfiles_root = "{{ config_root }}"

[settings.node]
compile = false

[bootstrap.packages]
"apt:git-delta" = "latest"
"apt:fish" = "latest"
"apt:bat" = "latest"
"apt:fd-find" = "latest"
"apt:eza" = "latest"
"apt:zoxide" = "latest"
"apt:fzf" = "latest"
"apt:jq" = "latest"

[dotfiles]
"~/.gitconfig" = "../git/.gitconfig"
"~/.config/git/attributes" = "../git/.config/git/attributes"
"~/.config/git/ignore" = "../git/.config/git/ignore"
"~/.config/git/template" = "../git/.config/git/template"
"~/.config/secretlint" = "../git/.config/secretlint"

# Claude Code: symlink で配布する個別ファイルのみ (tests / pyc は除外)
# CLAUDE.md / output-styles/gal.md は共有文書への絶対パス参照があるため template 配布
# （rendered 実ファイルになる。MISE_GLOBAL_CONFIG_ROOT が config_root を repo ルートへ解決）
"~/.claude/.gitkeep" = "../ai/claude/.gitkeep"
"~/.claude/CLAUDE.md" = { source = "../ai/claude/CLAUDE.md", mode = "template" }
"~/.claude/bash-env.sh" = "../ai/claude/bash-env.sh"
"~/.claude/output-styles/gal.md" = { source = "../ai/claude/output-styles/gal.md", mode = "template" }
"~/.claude/hooks/block_dangerous_command.py" = "../ai/claude/hooks/block_dangerous_command.py"
"~/.claude/hooks/detect_mojibake.py" = "../ai/claude/hooks/detect_mojibake.py"
"~/.claude/hooks/detect_secret.py" = "../ai/claude/hooks/detect_secret.py"

# Codex: グローバル AGENTS.md。共有文書への絶対パス参照（{{ vars.dotfiles_root }}）があるため
# symlink ではなく template で配布する（rendered 実ファイルになる）
"~/.codex/AGENTS.md" = { source = "../ai/codex/AGENTS.md", mode = "template" }

# Fish: 手動管理ファイルのみ（プラグイン tide/fzf/z は fish_plugins + fisher で再現）
"~/.config/fish/config.fish" = "../fish/.config/fish/config.fish"
"~/.config/fish/fish_plugins" = "../fish/.config/fish/fish_plugins"
"~/.config/fish/functions/up.fish" = "../fish/.config/fish/functions/up.fish"
"~/.config/fish/conf.d/clipboard2path.fish" = "../fish/.config/fish/conf.d/clipboard2path.fish"

# clipboard2path-wsl: fish hook のみ dotfiles 管理（unit / wl-paste wrapper は
# ツールの `init --no-hook` が生成。binary は aqua ([tools]) で導入）

# Yazi: 設定のみ（プラグイン・キャッシュは yazi が自分のディレクトリで管理）
"~/.config/yazi/yazi.toml" = "../yazi/.config/yazi/yazi.toml"
"~/.config/yazi/keymap.toml" = "../yazi/.config/yazi/keymap.toml"

# Glow: 設定のみ（スタイル等）
"~/.config/glow/glow.yml" = "../glow/.config/glow/glow.yml"

# Herdr: 設定のみ（plugins.json / session.json / logs は生成物として除外）
"~/.config/herdr/config.toml" = "../herdr/.config/herdr/config.toml"

# opencode: グローバル設定のみ（opencode.json）。plugin は plugin 宣言で管理。
# instructions が repo ルート相対パス（{{ vars.dotfiles_root }}）を指すため symlink ではなく
# template で配布する（rendered 実ファイルになる）。MISE_GLOBAL_CONFIG_ROOT が
# config_root を repo ルートに解決する（bootstrap.sh / fish config.fish で設定）
"~/.opencode/opencode.json" = { source = "../ai/opencode/opencode.json", mode = "template" }

# pnpm: グローバル設定（minimumReleaseAge によるサプライチェーン対策）
"~/.config/pnpm/config.yaml" = "../pnpm/.config/pnpm/config.yaml"

# bun: グローバル設定（minimumReleaseAge によるサプライチェーン対策）
"~/.bunfig.toml" = "../bun/.bunfig.toml"

# npm: グローバル設定（min-release-age によるサプライチェーン対策）
"~/.npmrc" = "../npm/.npmrc"

# Neovim (LazyVim): 設定のみ。lazy-lock.json 等の runtime artifact は除外
"~/.config/nvim/init.lua" = "../nvim/.config/nvim/init.lua"
"~/.config/nvim/lazyvim.json" = "../nvim/.config/nvim/lazyvim.json"
"~/.config/nvim/stylua.toml" = "../nvim/.config/nvim/stylua.toml"
"~/.config/nvim/.neoconf.json" = "../nvim/.config/nvim/.neoconf.json"
"~/.config/nvim/lua/config/autocmds.lua" = "../nvim/.config/nvim/lua/config/autocmds.lua"
"~/.config/nvim/lua/config/keymaps.lua" = "../nvim/.config/nvim/lua/config/keymaps.lua"
"~/.config/nvim/lua/config/lazy.lua" = "../nvim/.config/nvim/lua/config/lazy.lua"
"~/.config/nvim/lua/config/options.lua" = "../nvim/.config/nvim/lua/config/options.lua"
"~/.config/nvim/lua/plugins/lsp.lua" = "../nvim/.config/nvim/lua/plugins/lsp.lua"
"~/.config/nvim/lua/plugins/ui.lua" = "../nvim/.config/nvim/lua/plugins/ui.lua"

[tools]
"aqua:ba0918/clipboard2path-wsl" = "latest"
ast-grep = "latest"
aws-cli = { version = "latest", symlink_bins = "true" }
bun = "latest"
# AI CLI (claude / codex) は最新追従が優先のため、グローバルの minimum_release_age (7d)
# を per-tool で 1d に短縮する（当日リリースを 1 日待つだけ）。aqua の cosign /
# GitHub Artifact Attestations 検証はそのまま効く。急ぎの最新は明示ピンで回避可能
claude = { version = "latest", minimum_release_age = "1d" }
codex = { version = "latest", minimum_release_age = "1d" }
deno = "latest"
gh = "latest"
ghq = "latest"
glab = "latest"
glow = "latest"
go = "latest"
herdr = "latest"
just = "latest"
lazygit = "latest"
neovim = "latest"
node = "25.6.1"
opencode = "latest"
pnpm = "latest"
ripgrep = "latest"
rust = "latest"
# cargo サプライチェーン対策（crates.io 依存の脆弱性 / ライセンス検査）。cargo install 相当を
# mise の cargo backend で管理（手動の ~/.cargo/bin 版から移行済み）
"cargo:cargo-audit" = "latest"
"cargo:cargo-deny" = "latest"
# cargo 開発ツール一式（テスト実行 / カバレッジ / 依存更新 / ミューテーションテスト）も
# cargo install 相当を mise の cargo backend で管理
"cargo:cargo-llvm-cov" = "latest"
"cargo:cargo-mutants" = "latest"
"cargo:cargo-nextest" = "latest"
"cargo:cargo-outdated" = "latest"
shellcheck = "latest"
yazi = "latest"
zellij = "latest"

# bootstrap ステップ 15（mise run bootstrap）で claude-skills 共有文書を
# ai/shared/vendor/ に同期する（CLAUDE_SKILLS_VERSION で ref 上書き可）
[tasks.bootstrap]
run = "bash ${MISE_TASK_DIR}/../scripts/sync-shared.sh"

# pre-dotfiles: dotfiles の template 配布（CLAUDE.md / AGENTS.md / opencode.json）は
# {{ vars.dotfiles_root }} = {{ config_root }} を参照し、MISE_GLOBAL_CONFIG_ROOT が repo ルートを
# 指す前提で絶対パスにレンダリングされる。未設定 / 不一致のまま apply すると壊れたパス
# （$HOME/ai/shared/...）で静かに上書きされるため、ここで検証して失敗させる。
[bootstrap.hooks.pre-dotfiles]
run = "test -n \"${MISE_GLOBAL_CONFIG_FILE:-}\" && [ \"${MISE_GLOBAL_CONFIG_ROOT:-}\" = \"$(dirname \"$(dirname \"${MISE_GLOBAL_CONFIG_FILE}\")\")\" ] || { echo 'bootstrap: aborting: MISE_GLOBAL_CONFIG_ROOT must equal the repo root (set by bootstrap.sh / fish config.fish)' >&2; exit 1; }"

# post-dotfiles: deny-patterns.yaml から各ツールの deny 設定を合成・適用
# Claude Code: conf.d/ → settings.json（[dotfiles] 管轄外、runtime allow 保持）
# OpenCode: template 配布後に deny パターンを上書き
[bootstrap.hooks.post-dotfiles]
run = """
REPO_ROOT="$(dirname "$(dirname "${MISE_GLOBAL_CONFIG_FILE}")")"
bash "$REPO_ROOT/ai/claude/build-settings"
bash "$REPO_ROOT/scripts/generate-deny.sh" opencode-apply
"""
