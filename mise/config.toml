[env]
# bun global installs (e.g. codex) are not in mise-managed paths
_.path = ["~/.bun/bin", "~/.cargo/bin"]

[settings]
dotfiles.default_mode = "symlink"

[settings.node]
compile = false

[bootstrap.packages]
"apt:git-delta" = "latest"
"apt:fish" = "latest"
"apt:bat" = "latest"
"apt:fd-find" = "latest"
"apt:eza" = "latest"
"apt:zoxide" = "latest"
"apt:fzf" = "latest"

[dotfiles]
"~/.gitconfig" = "../git/.gitconfig"
"~/.config/git/attributes" = "../git/.config/git/attributes"
"~/.config/git/ignore" = "../git/.config/git/ignore"
"~/.config/git/template" = "../git/.config/git/template"
"~/.config/secretlint" = "../git/.config/secretlint"

# Claude Code: symlink で配布する個別ファイルのみ (tests / pyc は除外)
"~/.claude/.gitkeep" = "../claude/.claude/.gitkeep"
"~/.claude/CLAUDE.md" = "../claude/.claude/CLAUDE.md"
"~/.claude/bash-env.sh" = "../claude/.claude/bash-env.sh"
"~/.claude/output-styles/gal.md" = "../claude/.claude/output-styles/gal.md"
"~/.claude/hooks/block_dangerous_command.py" = "../claude/.claude/hooks/block_dangerous_command.py"
"~/.claude/hooks/detect_mojibake.py" = "../claude/.claude/hooks/detect_mojibake.py"
"~/.claude/hooks/detect_secret.py" = "../claude/.claude/hooks/detect_secret.py"

# Fish: 手動管理ファイルのみ（プラグイン tide/fzf/z は fish_plugins + fisher で再現）
"~/.config/fish/config.fish" = "../fish/.config/fish/config.fish"
"~/.config/fish/fish_plugins" = "../fish/.config/fish/fish_plugins"
"~/.config/fish/functions/up.fish" = "../fish/.config/fish/functions/up.fish"
"~/.config/fish/conf.d/clipboard2path.fish" = "../fish/.config/fish/conf.d/clipboard2path.fish"

# Yazi: 設定のみ（プラグイン・キャッシュは yazi が自分のディレクトリで管理）
"~/.config/yazi/yazi.toml" = "../yazi/.config/yazi/yazi.toml"
"~/.config/yazi/keymap.toml" = "../yazi/.config/yazi/keymap.toml"

[tools]
ast-grep = "latest"
aws-cli = { version = "latest", symlink_bins = "true" }
bun = "latest"
deno = "latest"
gh = "latest"
ghq = "latest"
go = "latest"
just = "latest"
lazygit = "latest"
node = "25.6.1"
opencode = "latest"
pnpm = "latest"
rust = "latest"
shellcheck = "latest"
yazi = "latest"
