[env]
# bun global installs (e.g. agent-browser) are not in mise-managed paths
_.path = ["~/.bun/bin", "~/.cargo/bin", "~/.safe-chain/shims"]

[settings]
dotfiles.default_mode = "symlink"
minimum_release_age = "7d"
# 自作ツールの aqua カスタムレジストリ（ツール repo が公開する URL）
aqua.registries = ["https://raw.githubusercontent.com/ba0918/clipboard2path-wsl/main/registry.yaml"]

[vars]
# MISE_GLOBAL_CONFIG_ROOT（bootstrap.sh / fish config.fish が repo ルートに設定）が
# config_root を repo ルートへ解決し、dotfiles の template から参照できる
dotfiles_root = "{{ config_root }}"

[settings.node]
compile = false

[bootstrap.packages]
"apt:git-delta" = "latest"
"apt:fish" = "latest"
"apt:bat" = "latest"
"apt:fd-find" = "latest"
"apt:eza" = "latest"
"apt:zoxide" = "latest"
"apt:fzf" = "latest"
"apt:jq" = "latest"
# codex jail shim（ai/codex/bin/codex）の mount namespace 構築に使う
"apt:bubblewrap" = "latest"
# 汎用アーカイブ
"apt:zip" = "latest"
"apt:unzip" = "latest"
"apt:zstd" = "latest"
# clipboard2path-wsl の実行時依存（Wayland クリップボード読み出しと WSL ユーティリティ）
"apt:wl-clipboard" = "latest"
"apt:wslu" = "latest"
# ブラウザ自動化（agent-browser / Playwright の Chromium）。`playwright install-deps chromium`
# が入れる一覧（2026-08 時点）を宣言で持つ。CJK / 絵文字フォントが無いとスクリーンショットが豆腐になる
"apt:libnss3" = "latest"
"apt:libnspr4" = "latest"
"apt:libasound2t64" = "latest"
"apt:fonts-liberation" = "latest"
"apt:fonts-freefont-ttf" = "latest"
"apt:fonts-ipafont-gothic" = "latest"
"apt:fonts-noto-color-emoji" = "latest"
"apt:fonts-wqy-zenhei" = "latest"
"apt:fonts-tlwg-loma-otf" = "latest"
"apt:fonts-unifont" = "latest"
"apt:xfonts-cyrillic" = "latest"
"apt:xfonts-scalable" = "latest"

[dotfiles]
"~/.gitconfig" = "../git/.gitconfig"
"~/.config/git/attributes" = "../git/.config/git/attributes"
"~/.config/git/ignore" = "../git/.config/git/ignore"
"~/.config/git/template" = "../git/.config/git/template"
"~/.config/secretlint" = "../git/.config/secretlint"

# Claude Code: symlink で配布する個別ファイルのみ (tests / pyc は除外)
# CLAUDE.md のみ template 配布（shared 文書への @ 参照をハーネスが展開するため）。
# output-styles/gal.md は shared/persona/gal.md への symlink、共通契約
# （interaction.md / human-readable.md）は ~/.claude/rules/ の symlink で常時適用
"~/.claude/.gitkeep" = "../ai/claude/.gitkeep"
"~/.claude/CLAUDE.md" = { source = "../ai/claude/CLAUDE.md", mode = "template" }
"~/.claude/bash-env.sh" = "../ai/claude/bash-env.sh"
"~/.claude/output-styles/gal.md" = "../ai/shared/persona/gal.md"
"~/.claude/rules/interaction.md" = "../ai/shared/interaction.md"
"~/.claude/rules/human-readable.md" = "../ai/shared/human-readable.md"
# hook スクリプトは ai/shared/hooks/ の単一実体を Claude / Codex 両方に配布する。
# detect_* は hook_input を import するため、同じディレクトリに揃える必要がある
"~/.claude/hooks/block_dangerous_command.py" = "../ai/shared/hooks/block_dangerous_command.py"
"~/.claude/hooks/detect_mojibake.py" = "../ai/shared/hooks/detect_mojibake.py"
"~/.claude/hooks/detect_secret.py" = "../ai/shared/hooks/detect_secret.py"
"~/.claude/hooks/hook_input.py" = "../ai/shared/hooks/hook_input.py"
# 外部依存（statusline.py / claude-notify / herdr-agent-state.sh）を存在チェック
# 付きで起動する共通ラッパ。未導入マシンで hook が毎回エラーになるのを防ぐ
"~/.claude/hooks/run-optional.sh" = "../ai/shared/hooks/run-optional.sh"

# Codex: グローバル AGENTS.md。共有文書への絶対パス参照（{{ vars.dotfiles_root }}）があるため
# symlink ではなく template で配布する（rendered 実ファイルになる）
"~/.codex/AGENTS.md" = { source = "../ai/codex/AGENTS.md", mode = "template" }

# Codex: hooks 定義と hook スクリプトは symlink で配布（変数を含まないため）。
# スクリプト実体は Claude と共有（ai/shared/hooks/）。ファイル単位で宣言するのは、
# ディレクトリ単位だと tests/ や __pycache__ まで ~/.codex/hooks に露出し、
# $HOME 側から repo に書き戻す経路も生むため
"~/.codex/hooks.json" = "../ai/codex/hooks.json"
"~/.codex/hooks/block_dangerous_command.py" = "../ai/shared/hooks/block_dangerous_command.py"
"~/.codex/hooks/detect_mojibake.py" = "../ai/shared/hooks/detect_mojibake.py"
"~/.codex/hooks/detect_secret.py" = "../ai/shared/hooks/detect_secret.py"
"~/.codex/hooks/hook_input.py" = "../ai/shared/hooks/hook_input.py"
"~/.codex/hooks/run-optional.sh" = "../ai/shared/hooks/run-optional.sh"

# Fish: 手動管理ファイルのみ（プラグイン tide/fzf/z は fish_plugins + fisher で再現）
"~/.config/fish/config.fish" = "../fish/.config/fish/config.fish"
"~/.config/fish/fish_plugins" = "../fish/.config/fish/fish_plugins"
"~/.config/fish/functions/up.fish" = "../fish/.config/fish/functions/up.fish"
"~/.config/fish/functions/__auto_ls.fish" = "../fish/.config/fish/functions/__auto_ls.fish"
"~/.config/fish/functions/fe.fish" = "../fish/.config/fish/functions/fe.fish"
"~/.config/fish/functions/gc.fish" = "../fish/.config/fish/functions/gc.fish"
"~/.config/fish/functions/gr.fish" = "../fish/.config/fish/functions/gr.fish"
"~/.config/fish/functions/gwt.fish" = "../fish/.config/fish/functions/gwt.fish"
"~/.config/fish/functions/myfuncs.fish" = "../fish/.config/fish/functions/myfuncs.fish"
"~/.config/fish/functions/ya.fish" = "../fish/.config/fish/functions/ya.fish"
"~/.config/fish/conf.d/clipboard2path.fish" = "../fish/.config/fish/conf.d/clipboard2path.fish"

# clipboard2path-wsl: fish hook のみ dotfiles 管理（unit / wl-paste wrapper は
# ツールの `init --no-hook` が生成。binary は aqua ([tools]) で導入）

# Yazi: 設定のみ（プラグイン・キャッシュは yazi が自分のディレクトリで管理）
"~/.config/yazi/yazi.toml" = "../yazi/.config/yazi/yazi.toml"
"~/.config/yazi/keymap.toml" = "../yazi/.config/yazi/keymap.toml"

# Glow: 設定のみ（スタイル等）
"~/.config/glow/glow.yml" = "../glow/.config/glow/glow.yml"

# Herdr: 設定のみ（plugins.json / session.json / logs は生成物として除外）
"~/.config/herdr/config.toml" = "../herdr/.config/herdr/config.toml"

# Devbox: グローバル環境の宣言（php / xdebug / pcov）。
# devbox.d と .devbox は生成物として除外（repo の実体を symlink で参照）
"~/.local/share/devbox/global/default/devbox.json" = "../devbox/global/devbox.json"
"~/.local/share/devbox/global/default/devbox.lock" = "../devbox/global/devbox.lock"

# opencode: グローバル設定のみ（opencode.json）。plugin は plugin 宣言で管理。
# instructions が repo ルート相対パス（{{ vars.dotfiles_root }}）を指すため symlink ではなく
# template で配布する（rendered 実ファイルになる）。MISE_GLOBAL_CONFIG_ROOT が
# config_root を repo ルートに解決する（bootstrap.sh / fish config.fish で設定）
"~/.opencode/opencode.json" = { source = "../ai/opencode/opencode.json", mode = "template" }

# pnpm: グローバル設定（minimumReleaseAge によるサプライチェーン対策）
"~/.config/pnpm/config.yaml" = "../pnpm/.config/pnpm/config.yaml"

# bun: グローバル設定（minimumReleaseAge によるサプライチェーン対策）
"~/.bunfig.toml" = "../bun/.bunfig.toml"

# npm: グローバル設定（min-release-age によるサプライチェーン対策）
"~/.npmrc" = "../npm/.npmrc"

# Neovim (LazyVim): 設定のみ。lazy-lock.json 等の runtime artifact は除外
"~/.config/nvim/init.lua" = "../nvim/.config/nvim/init.lua"
"~/.config/nvim/lazyvim.json" = "../nvim/.config/nvim/lazyvim.json"
"~/.config/nvim/stylua.toml" = "../nvim/.config/nvim/stylua.toml"
"~/.config/nvim/.neoconf.json" = "../nvim/.config/nvim/.neoconf.json"
"~/.config/nvim/lua/config/autocmds.lua" = "../nvim/.config/nvim/lua/config/autocmds.lua"
"~/.config/nvim/lua/config/keymaps.lua" = "../nvim/.config/nvim/lua/config/keymaps.lua"
"~/.config/nvim/lua/config/lazy.lua" = "../nvim/.config/nvim/lua/config/lazy.lua"
"~/.config/nvim/lua/config/options.lua" = "../nvim/.config/nvim/lua/config/options.lua"
"~/.config/nvim/lua/plugins/lsp.lua" = "../nvim/.config/nvim/lua/plugins/lsp.lua"
"~/.config/nvim/lua/plugins/ui.lua" = "../nvim/.config/nvim/lua/plugins/ui.lua"

[tools]
"aqua:ba0918/clipboard2path-wsl" = "latest"
# APM: Microsoft のエージェント設定用パッケージマネージャ（apm.yml / apm.lock）。
# aqua レジストリ未登録のため pipx バックエンド（pip install apm-cli 相当）で導入
"pipx:apm-cli" = "latest"
# Python の CLI ツールは pipx バックエンドで隔離 venv に入れる（手動の `uv tool install` から移行）
"pipx:pytest" = "latest"
# agentskills: Agent Skills 仕様のリファレンス実装 / バリデータ（PyPI: skills-ref）
"pipx:skills-ref" = "latest"
ast-grep = "latest"
atuin = "latest"
aws-cli = { version = "latest", symlink_bins = "true" }
bottom = "latest"
bun = "latest"
# AI CLI (claude / codex) は最新追従が優先のため、グローバルの minimum_release_age (7d)
# を per-tool で 1d に短縮する（当日リリースを 1 日待つだけ）。aqua の cosign /
# GitHub Artifact Attestations 検証はそのまま効く。急ぎの最新は明示ピンで回避可能
claude = { version = "latest", minimum_release_age = "1d" }
codex = { version = "latest", minimum_release_age = "1d" }
deno = "latest"
"aqua:jetify-com/devbox" = "latest"
direnv = "latest"
dust = "latest"
# dotenvx: .env の暗号化（aqua:dotenvx/dotenvx）。curl installer で ~/.local/bin に置いていたものを移行
dotenvx = "latest"
gh = "latest"
ghq = "latest"
glab = "latest"
glow = "latest"
go = "latest"
gum = "latest"
herdr = "latest"
hyperfine = "latest"
just = "latest"
lazygit = "latest"
# mo: Markdown template engine（k1LoW/mo）。ショート名衝突回避のためフル名で宣言
"aqua:k1LoW/mo" = "latest"
# tea: Gitea / Forgejo の CLI。配布元が gitea.com で aqua / github backend に無いため
# go backend でビルド導入する（[tools] の go に依存）。module path は gitea.dev/tea
# （旧 code.gitea.io/tea は go.mod の宣言と食い違い導入不能）。上げるときは gitea.com/gitea/tea の release を見る
"go:gitea.dev/tea" = "0.15.1"
neovim = "latest"
node = "25.9.0"
# ollama: ローカル LLM。公式 installer（/usr/local/bin + systemd service）ではなく
# バイナリだけを mise で持つ。サーバは使うときに `ollama serve` で手動起動
ollama = "latest"
opencode = { version = "latest", minimum_release_age = "1d" }
pnpm = "latest"
ripgrep = "latest"
rust = "latest"
# uv: Python のパッケージ / プロジェクト管理。公式 installer で ~/.local/bin に置いていたものを移行
uv = "latest"
# cargo サプライチェーン対策（crates.io 依存の脆弱性 / ライセンス検査）。cargo install 相当を
# mise の cargo backend で管理（手動の ~/.cargo/bin 版から移行済み）
"cargo:cargo-audit" = "latest"
"cargo:cargo-deny" = "latest"
# cargo 開発ツール一式（テスト実行 / カバレッジ / 依存更新 / ミューテーションテスト）も
# cargo install 相当を mise の cargo backend で管理
"cargo:cargo-llvm-cov" = "latest"
"cargo:cargo-mutants" = "latest"
"cargo:cargo-nextest" = "latest"
"cargo:cargo-outdated" = "latest"
# similarity-rs / -ts: コード重複検出（refactor-similarity-rs / -ts スキルが呼ぶ）。
# 手動の cargo install 版（~/.cargo/bin）から移行
"cargo:similarity-rs" = "latest"
"cargo:similarity-ts" = "latest"
shellcheck = "latest"
# usage: mise の補完が要求する（mise completion fish が usage CLI をチェックする）
usage = "latest"
yazi = "latest"
zellij = "latest"
# zoxide: apt 版 0.9.3 は fish 4.x と互換だが更新が遅い。aqua 管理で最新追従する。
# 0.9.8 に fish 4.x 退行（embedded cd.fish 未対応）があったが 0.10.0 で修正済み
zoxide = "latest"
lefthook = "latest"
npm = "11.19.0"
"npm:fkill-cli" = "latest"
"npm:secretlint" = "13.0.4"

# bootstrap ステップ 15（mise run bootstrap）で claude-skills 共有文書を
# ai/shared/vendor/ に同期する（CLAUDE_SKILLS_VERSION で ref 上書き可）
[tasks.bootstrap]
run = "bash ${MISE_TASK_DIR}/../scripts/sync-shared.sh"

# pre-dotfiles: dotfiles の template 配布（CLAUDE.md / AGENTS.md / opencode.json）は
# {{ vars.dotfiles_root }} = {{ config_root }} を参照し、MISE_GLOBAL_CONFIG_ROOT が repo ルートを
# 指す前提で絶対パスにレンダリングされる。未設定 / 不一致のまま apply すると壊れたパス
# （$HOME/ai/shared/...）で静かに上書きされるため、ここで検証して失敗させる。
[bootstrap.hooks.pre-dotfiles]
run = "test -n \"${MISE_GLOBAL_CONFIG_FILE:-}\" && [ \"${MISE_GLOBAL_CONFIG_ROOT:-}\" = \"$(dirname \"$(dirname \"${MISE_GLOBAL_CONFIG_FILE}\")\")\" ] || { echo 'bootstrap: aborting: MISE_GLOBAL_CONFIG_ROOT must equal the repo root (set by bootstrap.sh / fish config.fish)' >&2; exit 1; }"

# post-dotfiles: deny-patterns.yaml から各ツールの deny 設定を合成・適用
# Claude Code: conf.d/ → settings.json（[dotfiles] 管轄外、runtime allow 保持）
# OpenCode: template 配布後に deny パターンを上書き
[bootstrap.hooks.post-dotfiles]
run = """
REPO_ROOT="$(dirname "$(dirname "${MISE_GLOBAL_CONFIG_FILE}")")"
bash "$REPO_ROOT/ai/claude/build-settings"
bash "$REPO_ROOT/scripts/generate-deny.sh" opencode-apply
"""
